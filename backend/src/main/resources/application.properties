spring.application.name=locus
server.port=8081
groq.api.key=${GROQ_API_KEY}

logging.level.org.hibernate.SQL=TRACE
logging.level.org.hibernate.tool.schema.internal.SchemaCreatorImpl=TRACE

# H2 in-memory database (MySQL compatibility mode)
# spring.datasource.url=jdbc:h2:mem:locus;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# Enable H2 console (access via http://localhost:8081/h2-console)
# spring.h2.console.enabled=true


# WebClient Logging
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=DEBUG

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/locus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true