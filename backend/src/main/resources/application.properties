spring.application.name=locus
server.port=8081

# H2 in-memory database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:locus;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console (access via http://localhost:8081/h2-console)
spring.h2.console.enabled=true


# Auto-run schema.sql and data.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql